[package]
name = "shapecraft-update"
description = "ShapeCraft updates: checking GitHub releases, downloading in the background, and installing in place"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
dirs = "6"
sha2 = "0.10"
# The platform's own certificate store, so a proxy or company certificate the system trusts works here too.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[lints]
workspace = true
