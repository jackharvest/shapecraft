[package]
name = "shapecraft-ui"
description = "ShapeCraft desktop UI (egui): landing, workspace, tools, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shapecraft-kernel.workspace = true
shapecraft-doc.workspace = true
shapecraft-engine.workspace = true
shapecraft-render.workspace = true
shapecraft-update.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit"] }
egui = "0.37"
egui-wgpu = "0.37"
wgpu = "30"
png = "0.18"
rfd = "0.17"
dirs = "6"
# Tablet access (Preferences ▸ Tablet, `--serve`): the browser page talks over a WebSocket; frames go out as JPEG/PNG.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
jpeg-encoder = "0.7"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
shapecraft-kernel-occt.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
