<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0c0d11}
body{font-family:Inter,sans-serif;color:#f4f5f8;position:relative;-webkit-font-smoothing:antialiased}
/* light behind the model */
.glow{position:absolute;inset:0;background:
  radial-gradient(520px 380px at 860px 330px,rgba(29,79,255,.55),transparent 70%),
  radial-gradient(900px 500px at 1000px 700px,rgba(29,79,255,.22),transparent 70%),
  radial-gradient(600px 400px at 0px 0px,rgba(255,255,255,.04),transparent 70%)}
/* the CAD floor, in perspective */
.floor{position:absolute;left:-600px;right:-600px;bottom:0;height:900px;transform:perspective(500px) rotateX(68deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px),
  linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:160px 160px,160px 160px,32px 32px,32px 32px;
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.85),transparent 60%)}
.axis-x{position:absolute;left:560px;right:-40px;bottom:96px;height:2px;background:linear-gradient(90deg,transparent,#e5484d 30%,rgba(229,72,77,.4));transform:rotate(-8deg);opacity:.7}
.model{position:absolute;right:18px;top:64px;width:610px;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6)) drop-shadow(0 0 60px rgba(29,79,255,.35))}
.left{position:absolute;left:72px;top:64px;width:560px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px;height:64px;filter:drop-shadow(0 6px 18px rgba(29,79,255,.45))}
.wm{font-weight:800;font-size:38px;letter-spacing:-.035em}
.alpha{font:500 13px "JetBrains Mono",monospace;color:#c9d3ff;background:rgba(29,79,255,.28);border:1px solid rgba(120,150,255,.45);padding:3px 10px;border-radius:99px;margin-left:4px}
h1{margin-top:58px;font-weight:800;font-size:84px;line-height:.98;letter-spacing:-.045em}
h1 span{background:linear-gradient(92deg,#ffffff 10%,#9db4ff 60%,#4f7bff);-webkit-background-clip:text;color:transparent}
.sub{margin-top:22px;font-size:26px;line-height:1.35;color:#b7bcc8;font-weight:500;letter-spacing:-.01em}
.chips{display:flex;gap:10px;margin-top:34px}
.chip{font-size:16px;font-weight:600;padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#e9ecf3;display:flex;align-items:center;gap:8px}
.chip i{width:8px;height:8px;border-radius:50%;background:#2fbf71;display:inline-block}
.url{position:absolute;left:72px;bottom:44px;font:500 17px "JetBrains Mono",monospace;color:#7f8696}
/* a Parameter Card pill floating by the model, like the app's */
.pill{position:absolute;right:56px;bottom:40px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;
  background:rgba(35,35,38,.82);border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 40px rgba(0,0,0,.45);font-size:15px;font-weight:600;backdrop-filter:blur(8px)}
.pill b{font:500 14px "JetBrains Mono",monospace;color:#9db4ff;font-weight:500}
.pill .dot{width:22px;height:22px;border-radius:7px;background:#1d4fff;display:grid;place-items:center;font-size:12px}
</style></head>
<body>
<div class="glow"></div>
<div class="floor"></div>
<img class="model" src="og-handheld.png" alt="">
<div class="left">
  <div class="brand"><img src="../media/icon-256.png" alt=""><div class="wm">ShapeCraft</div><div class="alpha">alpha</div></div>
  <h1><span>Push, pull,<br>done.</span></h1>
  <div class="sub">Free 3D modeling for macOS, Windows and Linux. Sketch it, pull it, print it.</div>
  <div class="chips"><div class="chip"><i></i>Free &amp; open source</div><div class="chip">No account</div><div class="chip">Works offline</div></div>
</div>
<div class="url">jackharvest.com/shapecraft</div>
<div class="pill"><div class="dot">⟲</div>History<b>30 steps · all editable</b></div>
</body></html>
