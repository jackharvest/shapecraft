[package]
name = "shapecraft"
description = "ShapeCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shapecraft-ui.workspace = true
shapecraft-kernel.workspace = true
shapecraft-kernels = { workspace = true, features = ["occt"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit", "clipboard"] }
egui = "0.37"
anyhow.workspace = true
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false }

[lints]
workspace = true
