# Pushing a tag like v0.4.0-alpha builds every download and publishes them as a GitHub release:
#   a universal macOS DMG (Apple silicon and Intel), a Windows installer, MSI and portable zip, a Linux AppImage, .deb, .rpm and
#   tar.gz, an Android APK
#   (arm64, signed with the release key from the repository's secrets), an iPhone .ipa for sideloading, the plugins
#   (.scplugin + plugins-index.json), SHA256SUMS.txt.
# File names follow the Craft App Suite's (shapecraft-<version>-<os>-<arch>[-portable].<ext>); the app's updater and
# the website pick their files by those names. OCCT comes from conda-forge on every platform and goes inside each
# download. Builds are unsigned for now. SHAPECRAFT_RELEASE=1 marks these builds as releases, which check for updates.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  SHAPECRAFT_RELEASE: '1'
defaults:
  run:
    shell: bash -el {0}

jobs:
  macos:
    # One universal app (Apple silicon and Intel) built on Apple silicon: the Intel half is cross-compiled against
    # conda-forge's osx-64 OCCT and both halves are merged with lipo (xtask/src/mac.rs). The Intel half is run once
    # under Rosetta. Copies up to 0.8.5 update from the per-chip names, so the same DMG also goes out under those
    # (docs/updates.md).
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with: { environment-name: occt, create-args: occt=7.9 }
      - name: OCCT for Intel
        run: |
          "${MAMBA_EXE:-micromamba}" create -y -q -p "$RUNNER_TEMP/occt-x64" --platform osx-64 -c conda-forge occt=7.9
          echo "OCCT_X64=$RUNNER_TEMP/occt-x64" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - name: Build for Apple silicon
        run: |
          OCCT_INCLUDE_DIR="$CONDA_PREFIX/include/opencascade" OCCT_LIB_DIR="$CONDA_PREFIX/lib" \
            cargo build --release --locked --target aarch64-apple-darwin -p shapecraft -p shapecraft-cli
      - name: Build for Intel
        run: |
          OCCT_INCLUDE_DIR="$OCCT_X64/include/opencascade" OCCT_LIB_DIR="$OCCT_X64/lib" \
            cargo build --release --locked --target x86_64-apple-darwin -p shapecraft -p shapecraft-cli
      - name: Universal app and DMG
        run: OCCT_LIB_DIR_ARM64="$CONDA_PREFIX/lib" OCCT_LIB_DIR_X86_64="$OCCT_X64/lib" cargo xtask bundle-mac --universal
      - name: Kernel smoke test, each chip
        run: |
          cli="$PWD/target/macos-bundle/ShapeCraft.app/Contents/MacOS/shapecraft-cli"
          for a in arm64 x86_64; do
            d="$RUNNER_TEMP/smoke-$a"; mkdir -p "$d"
            sed "s#OUT#$d#g" packaging/android/smoke.jsonl > "$d/smoke.jsonl"
            (cd "$d" && arch "-$a" "$cli" run smoke.jsonl > out.txt 2>&1) || { cat "$d/out.txt"; exit 1; }
            grep '^measure: ' "$d/out.txt" | sed 's/.*"volume_mm3":\([0-9.e+-]*\).*/\1/' > "$d/v.txt"
            echo "$a: $(tr '\n' ' ' < "$d/v.txt")"
            [ "$(wc -l < "$d/v.txt")" -eq 2 ] || { cat "$d/out.txt"; exit 1; }
          done
          cmp "$RUNNER_TEMP/smoke-arm64/v.txt" "$RUNNER_TEMP/smoke-x86_64/v.txt"
      - name: The same DMG under the names copies up to 0.8.5 update from
        run: |
          u=$(ls target/shapecraft-*-macos-universal.dmg); base=${u%-macos-universal.dmg}
          cp "$u" "$base-autoupdate-only-macos-arm64.dmg"
          cp "$u" "$base-autoupdate-only-macos-x86_64.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: 'target/*.dmg', if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with: { environment-name: occt, create-args: occt=7.9 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Point the build at OCCT
        run: |
          root="$CONDA_PREFIX/Library"
          echo "$root/bin" >> "$GITHUB_PATH"
          # The bundle step runs in PowerShell, where conda's variables aren't set: tell it where OCCT's DLLs are.
          echo "OCCT_BIN=$root/bin" >> "$GITHUB_ENV"
          echo "OCCT_INCLUDE_DIR=$root/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$root/lib" >> "$GITHUB_ENV"
      # Git for Windows puts its own link.exe (coreutils) on the PATH ahead of Microsoft's linker: name MSVC's.
      - name: Build
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER)) { throw "MSVC link.exe not found" }
          cargo build --release --locked -p shapecraft -p shapecraft-cli
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # The MSI is what the Craft App Suite's launcher installs.
      - name: WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Bundle
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          cargo xtask bundle-windows
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "target/*-portable.zip\ntarget/*-setup.exe\ntarget/*.msi", if-no-files-found: error }

  linux:
    # The oldest Ubuntu runner: the programs need the glibc they were built against or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with: { environment-name: occt, create-args: occt=7.9 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Window libraries, patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf libfuse2 libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Point the build at OCCT
        run: |
          echo "OCCT_INCLUDE_DIR=$CONDA_PREFIX/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p shapecraft -p shapecraft-cli
      - name: Bundle (conda's OCCT needs its own C++ runtime along)
        run: LD_LIBRARY_PATH="$OCCT_LIB_DIR" BUNDLE_CXX_RUNTIME=1 cargo xtask bundle-linux
      - name: AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" cargo xtask appimage
      # .deb and .rpm (what the Craft App Suite's launcher installs on those distributions), nfpm checked by its hash.
      - name: deb and rpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          echo "787af76e172dd5fc7cedf4d7c5a090a2f62be9001557a4db1103e270f90ddefd  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
          cargo xtask linux-packages
      # Plugins (plugins/official and /community), precompiled for this version's runtime, and the list the app's
      # Browse reads. They're release files like the rest, so SHA256SUMS.txt covers them too.
      - name: Plugins
        run: cargo xtask plugin build && cargo xtask plugin index && rm -f target/plugins/hello-*.scplugin
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "target/*.tar.gz\ntarget/*.AppImage\ntarget/*.deb\ntarget/*.rpm\ntarget/plugins/*.scplugin\ntarget/plugins/plugins-index.json", if-no-files-found: error }

  android:
    # Release-signed (#8): the same key every time, so each APK installs over the last one. OCCT for Android comes
    # from the cache android.yml fills on main (a cold build takes about 40 minutes).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # No key yet (cargo xtask android-release-key makes one): the release has no APK and nothing else runs.
      - name: Release key present?
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "present=1" >> "$GITHUB_OUTPUT"; else echo "::notice::No ANDROID_KEYSTORE_B64 secret: the release has no APK"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.present
        with:
          targets: aarch64-linux-android
      - uses: ./.github/actions/android-occt
        if: steps.key.outputs.present
      - name: ShapeCraft APK (release-signed)
        if: steps.key.outputs.present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SHAPECRAFT_APK_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          export SHAPECRAFT_APK_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$SHAPECRAFT_APK_KEYSTORE"
          cargo xtask android-apk arm64
          rm -f "$SHAPECRAFT_APK_KEYSTORE"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist && cp target/android/ShapeCraft-*-arm64-v8a.apk "dist/shapecraft-${version}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present
        with: { name: android, path: dist/*.apk, if-no-files-found: error }

  ios:
    # An .ipa for sideloading (docs/ios.md): ad-hoc signed, so AltStore, Sideloadly and the like sign it with the
    # user's own Apple account. It needs the iOS 27.1 SDK or newer: iOS runs an app built with an older SDK
    # letterboxed on the iPhone Duo. While the runners' newest Xcode is older than that, the .ipa is built on a Mac
    # with `cargo xtask ios-stage` (a private draft release "ipa-<version>") and checked and taken from there.
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      OCCT_TAG: V7_9_3
      OCCT_SHA256: 5ecf094ec6b12d5413dfb851d8c3590c354058aee556e32e408bdfbf8c357d57
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode (iOS SDK 27.1 or newer builds here)
        id: xcode
        run: |
          x=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          v=$(DEVELOPER_DIR="$x/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version)
          echo "$x: iOS SDK $v"
          if printf '27.1\n%s\n' "$v" | sort -V -C; then
            echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"
            echo "build=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::iOS SDK $v is older than 27.1: taking the .ipa staged from a Mac"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.xcode.outputs.build
        with: { targets: aarch64-apple-ios }
      - uses: actions/cache@v4
        if: steps.xcode.outputs.build
        with:
          path: target/ios/occt-device
          key: occt-ios-device-V7_9_3-macos26-ios15-${{ hashFiles('crates/kernel-occt/build.rs', 'xtask/src/ios.rs', 'xtask/src/android.rs') }}
          restore-keys: occt-ios-device-V7_9_3-macos26-ios15-
      - name: OCCT for iOS
        if: steps.xcode.outputs.build
        run: |
          if [ ! -f target/ios/occt-device/lib/libTKernel.a ]; then
            command -v ninja > /dev/null || brew install ninja
            mkdir -p "$RUNNER_TEMP/occt" && cd "$RUNNER_TEMP/occt"
            curl -sfL -o occt.tar.gz "https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/$OCCT_TAG.tar.gz"
            echo "$OCCT_SHA256  occt.tar.gz" | shasum -a 256 -c
            tar xzf occt.tar.gz
            cd "$GITHUB_WORKSPACE"
            OCCT_SRC="$RUNNER_TEMP/occt/OCCT-${OCCT_TAG#V}" cargo xtask ios-occt device
          fi
      - name: Sideload build (.ipa)
        if: steps.xcode.outputs.build
        run: |
          cargo xtask ios-ipa
          mkdir -p dist && cp target/shapecraft-*-ios-arm64.ipa dist/
      - name: The .ipa staged from a Mac
        if: ${{ !steps.xcode.outputs.build }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          gh release download "ipa-$version" -p "shapecraft-$version-ios-arm64.ipa" -D dist
      - name: Check the .ipa (version, SDK 27.1 or newer, arm64)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ipa="dist/shapecraft-$version-ios-arm64.ipa"
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app="$RUNNER_TEMP/ipa/Payload/ShapeCraft.app"
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          sdk=$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformVersion' "$app/Info.plist")
          echo "version $v, iOS SDK $sdk, $(lipo -archs "$app/ShapeCraft")"
          [ "$v" = "$version" ] || { echo "::error::the .ipa is $v, not $version"; exit 1; }
          printf '27.1\n%s\n' "$sdk" | sort -V -C || { echo "::error::the .ipa was built with iOS SDK $sdk (older than 27.1)"; exit 1; }
          [ "$(lipo -archs "$app/ShapeCraft")" = arm64 ]
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: dist/*.ipa, if-no-files-found: error }

  windows-arm64:
    # Windows on Arm (Surface and other Snapdragon machines, #61). conda-forge has no OpenCASCADE for Arm, so it's
    # built here from source (only our toolkits, as DLLs) and cached. Never holds the release back.
    runs-on: windows-11-arm
    timeout-minutes: 150
    env:
      OCCT_TAG: V7_9_3
      OCCT_SHA256: 5ecf094ec6b12d5413dfb851d8c3590c354058aee556e32e408bdfbf8c357d57
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: arm64 }
      - uses: actions/cache/restore@v4
        id: occt-cache
        with:
          path: target/windows-occt-arm64
          key: occt-windows-arm64-V7_9_3-${{ hashFiles('crates/kernel-occt/build.rs', 'xtask/src/windows.rs') }}
      - name: OCCT for Windows on Arm
        shell: pwsh
        run: |
          if (-not (Test-Path target\windows-occt-arm64\bin\TKernel.dll)) {
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\occt" | Out-Null
            $tgz = "$env:RUNNER_TEMP\occt\occt.tar.gz"
            Invoke-WebRequest -Uri "https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/$env:OCCT_TAG.tar.gz" -OutFile $tgz
            if ((Get-FileHash $tgz -Algorithm SHA256).Hash.ToLower() -ne $env:OCCT_SHA256) { throw "OCCT source checksum mismatch" }
            tar -xzf $tgz -C "$env:RUNNER_TEMP\occt"
            $env:OCCT_SRC = "$env:RUNNER_TEMP\occt\OCCT-$($env:OCCT_TAG.Substring(1))"
            cargo xtask windows-occt
            if ($LASTEXITCODE -ne 0) { throw "windows-occt failed" }
          }
      # Saved as soon as it's built (OCCT takes ~40 min here), even if a later step fails.
      - uses: actions/cache/save@v4
        if: steps.occt-cache.outputs.cache-hit != 'true'
        with:
          path: target/windows-occt-arm64
          key: occt-windows-arm64-V7_9_3-${{ hashFiles('crates/kernel-occt/build.rs', 'xtask/src/windows.rs') }}
      - name: Point the build at OCCT
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\target\windows-occt-arm64"
          "$root\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "OCCT_BIN=$root\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OCCT_INCLUDE_DIR=$root\include\opencascade" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OCCT_LIB_DIR=$root\lib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: |
          $env:CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER = Join-Path $env:VCToolsInstallDir 'bin\Hostarm64\arm64\link.exe'
          if (-not (Test-Path $env:CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER)) { throw "MSVC link.exe not found" }
          cargo build --release --locked -p shapecraft -p shapecraft-cli
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Smoke test (the kernel on Arm)
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force $d | Out-Null
          (Get-Content packaging\android\smoke.jsonl) -replace 'OUT', ($d -replace '\\', '/') | Set-Content "$d\smoke.jsonl"
          target\release\shapecraft-cli.exe run "$d\smoke.jsonl"
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
      - name: WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      # Portable zip and MSI (no setup.exe: Windows goes MSI-only).
      - name: Bundle
        shell: pwsh
        run: |
          $env:CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER = Join-Path $env:VCToolsInstallDir 'bin\Hostarm64\arm64\link.exe'
          cargo xtask bundle-windows
          if ($LASTEXITCODE -ne 0) { throw "bundle failed" }
      - uses: actions/upload-artifact@v4
        with: { name: windows-arm64, path: "target/*-windows-arm64-portable.zip\ntarget/*-windows-arm64.msi", if-no-files-found: error }

  publish:
    # The desktop downloads must all be there; the APK, the .ipa and the Windows on Arm files join them when they
    # built (none of them holds the release back).
    needs: [macos, windows, windows-arm64, linux, android, ios]
    if: always() && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        # The linux artifact keeps the plugins in a plugins/ folder; the release takes every file at the top.
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The notes are the version's CHANGELOG.md section, which already covers everything since the last public
          # release (docs/versioning.md), then how to open the downloads.
          awk -v h="## ${tag#v}" '
            $0 == h {on = 1; next}
            on && /^## / {exit}
            on' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "Alpha: keep copies of anything important. ShapeCraft updates itself from here on: it downloads new"
            echo "versions in the background and installs them when you close it."
            echo
            echo "**Mac:** download the \`-macos-universal.dmg\` (Apple silicon and Intel). The two \`autoupdate-only\`"
            echo "copies are the same file, there for copies of ShapeCraft up to 0.8.5 to update from."
            echo
            echo "**First launch:** macOS asks once: System Settings ▸ Privacy & Security ▸ Open Anyway."
            echo "**Windows on Arm** (Surface and other Snapdragon PCs): the \`-windows-arm64\` MSI or portable zip, when present."
            echo "Windows SmartScreen: More info ▸ Run anyway. Linux: make the AppImage executable, then double-click it,"
            echo "or install the .deb (Debian, Ubuntu) or .rpm (Fedora, openSUSE) package."
            echo "Android (test build, arm64, Android 8.0+): open the APK on the device and allow installs from that app."
            echo "A copy installed from an earlier test build (debug-signed) has to be uninstalled once first."
            echo "iPhone (test build, iOS 17+, iPhone Duo included): sideload the \`-ios-arm64.ipa\` with AltStore,"
            echo "Sideloadly or a similar tool, signed with your own Apple account (a free one re-signs every 7 days)."
            echo "Or build it from source: docs/ios.md."
            echo
            echo "Check a download against SHA256SUMS.txt: \`shasum -a 256 FILE\` (macOS, Linux) or \`Get-FileHash FILE\` (Windows)."
          } >> notes.md
          gh release create "$tag" dist/* --title "ShapeCraft ${tag#v}" --notes-file notes.md --latest
          # The staging draft for the .ipa (if there was one) has done its job. It's named by the Cargo.toml version
          # (ipa-0.9.3), not the tag (v0.9.3-alpha).
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          gh release delete "ipa-$version" --yes 2>/dev/null || true
