# Pushing a tag like v0.4.0-alpha builds every download and publishes them as a GitHub release:
#   macOS DMGs (Apple silicon, Intel), a Windows installer, MSI and portable zip, a Linux AppImage, .deb, .rpm and
#   tar.gz, an Android APK
#   (arm64, signed with the release key from the repository's secrets), SHA256SUMS.txt.
# File names follow the Craft App Suite's (shapecraft-<version>-<os>-<arch>[-portable].<ext>); the app's updater and
# the website pick their files by those names. OCCT comes from conda-forge on every platform and goes inside each
# download. Builds are unsigned for now. SHAPECRAFT_RELEASE=1 marks these builds as releases, which check for updates.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  SHAPECRAFT_RELEASE: '1'
defaults:
  run:
    shell: bash -el {0}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]   # Apple silicon, Intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with: { environment-name: occt, create-args: occt=7.9 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Point the build at OCCT
        run: |
          echo "OCCT_INCLUDE_DIR=$CONDA_PREFIX/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p shapecraft -p shapecraft-cli
      - run: cargo xtask bundle-mac
      - uses: actions/upload-artifact@v4
        with: { name: 'macos-${{ matrix.runner }}', path: 'target/*.dmg', if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with: { environment-name: occt, create-args: occt=7.9 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Point the build at OCCT
        run: |
          root="$CONDA_PREFIX/Library"
          echo "$root/bin" >> "$GITHUB_PATH"
          # The bundle step runs in PowerShell, where conda's variables aren't set: tell it where OCCT's DLLs are.
          echo "OCCT_BIN=$root/bin" >> "$GITHUB_ENV"
          echo "OCCT_INCLUDE_DIR=$root/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$root/lib" >> "$GITHUB_ENV"
      # Git for Windows puts its own link.exe (coreutils) on the PATH ahead of Microsoft's linker: name MSVC's.
      - name: Build
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER)) { throw "MSVC link.exe not found" }
          cargo build --release --locked -p shapecraft -p shapecraft-cli
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # The MSI is what the Craft App Suite's launcher installs.
      - name: WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Bundle
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          cargo xtask bundle-windows
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "target/*-portable.zip\ntarget/*-setup.exe\ntarget/*.msi", if-no-files-found: error }

  linux:
    # The oldest Ubuntu runner: the programs need the glibc they were built against or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with: { environment-name: occt, create-args: occt=7.9 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Window libraries, patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf libfuse2 libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Point the build at OCCT
        run: |
          echo "OCCT_INCLUDE_DIR=$CONDA_PREFIX/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p shapecraft -p shapecraft-cli
      - name: Bundle (conda's OCCT needs its own C++ runtime along)
        run: LD_LIBRARY_PATH="$OCCT_LIB_DIR" BUNDLE_CXX_RUNTIME=1 cargo xtask bundle-linux
      - name: AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" cargo xtask appimage
      # .deb and .rpm (what the Craft App Suite's launcher installs on those distributions), nfpm checked by its hash.
      - name: deb and rpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          echo "787af76e172dd5fc7cedf4d7c5a090a2f62be9001557a4db1103e270f90ddefd  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
          cargo xtask linux-packages
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "target/*.tar.gz\ntarget/*.AppImage\ntarget/*.deb\ntarget/*.rpm", if-no-files-found: error }

  android:
    # Release-signed (#8): the same key every time, so each APK installs over the last one. OCCT for Android comes
    # from the cache android.yml fills on main (a cold build takes about 40 minutes).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # No key yet (cargo xtask android-release-key makes one): the release has no APK and nothing else runs.
      - name: Release key present?
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "present=1" >> "$GITHUB_OUTPUT"; else echo "::notice::No ANDROID_KEYSTORE_B64 secret: the release has no APK"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.present
        with:
          targets: aarch64-linux-android
      - uses: ./.github/actions/android-occt
        if: steps.key.outputs.present
      - name: ShapeCraft APK (release-signed)
        if: steps.key.outputs.present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SHAPECRAFT_APK_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          export SHAPECRAFT_APK_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$SHAPECRAFT_APK_KEYSTORE"
          cargo xtask android-apk arm64
          rm -f "$SHAPECRAFT_APK_KEYSTORE"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist && cp target/android/ShapeCraft-*-arm64-v8a.apk "dist/shapecraft-${version}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present
        with: { name: android, path: dist/*.apk, if-no-files-found: error }

  publish:
    # The desktop downloads must all be there; the APK joins them when it built (it never holds the release back).
    needs: [macos, windows, linux, android]
    if: always() && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The notes are the version's CHANGELOG.md section, which already covers everything since the last public
          # release (docs/versioning.md), then how to open the downloads.
          awk -v h="## ${tag#v}" '
            $0 == h {on = 1; next}
            on && /^## / {exit}
            on' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "Alpha: keep copies of anything important. ShapeCraft updates itself from here on: it downloads new"
            echo "versions in the background and installs them when you close it."
            echo
            echo "**First launch:** macOS asks once: System Settings ▸ Privacy & Security ▸ Open Anyway."
            echo "Windows SmartScreen: More info ▸ Run anyway. Linux: make the AppImage executable, then double-click it,"
            echo "or install the .deb (Debian, Ubuntu) or .rpm (Fedora, openSUSE) package."
            echo "Android (test build, arm64, Android 8.0+): open the APK on the device and allow installs from that app."
            echo "A copy installed from an earlier test build (debug-signed) has to be uninstalled once first."
            echo
            echo "Check a download against SHA256SUMS.txt: \`shasum -a 256 FILE\` (macOS, Linux) or \`Get-FileHash FILE\` (Windows)."
          } >> notes.md
          gh release create "$tag" dist/* --title "ShapeCraft ${tag#v}" --notes-file notes.md --latest
