# Android (#3): OCCT built with the NDK; shapecraft-cli cross-compiled for arm64 with the kernel smoke test run on an
# emulator (x86_64 image; it runs the arm64 build through Android's ARM translation); the app as a debug-signed APK,
# started on the same emulator. The NDK/OCCT setup is shared with release.yml (.github/actions/android-occt).
# Manual or weekly: the OCCT build is long, so it doesn't run on every push. See packaging/android/README.md.
name: android
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: ./.github/actions/android-occt
      - name: shapecraft-cli for Android (16 KB pages checked)
        run: cargo xtask android-cli arm64
      - name: ShapeCraft APK (debug-signed; releases are signed in release.yml)
        run: cargo xtask android-apk arm64
      # The downloads go up first, so a failing emulator never costs the build.
      - uses: actions/upload-artifact@v4
        with:
          name: shapecraft-cli-android-arm64
          path: target/aarch64-linux-android/release/shapecraft-cli
      - uses: actions/upload-artifact@v4
        with:
          name: shapecraft-android-apk
          path: target/android/ShapeCraft-*.apk
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # x86_64 image; the arm64 build runs through Android's ARM translation. The action boots it with time limits
      # (a bare `adb wait-for-device` waited for an emulator that never came up until the job timed out).
      - name: Kernel smoke test and app start on the emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            cargo xtask android-smoke arm64
            cargo xtask android-run arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screen
          path: target/android/screen.png
          if-no-files-found: ignore
