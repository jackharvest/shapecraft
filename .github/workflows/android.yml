# Android (#3): OCCT built with the NDK; shapecraft-cli cross-compiled for arm64 with the kernel smoke test run on an
# emulator (x86_64 image; it runs the arm64 build through Android's ARM translation); the app as a debug-signed APK,
# started on the same emulator.
# Manual or weekly: the OCCT build is long, so it doesn't run on every push. See packaging/android/README.md.
name: android
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
env:
  NDK_ZIP: android-ndk-r28c-linux.zip
  NDK_SHA1: a7b54a5de87fecd125a17d54f73c446199e72a64
  OCCT_TAG: V7_9_3
  OCCT_SHA256: 5ecf094ec6b12d5413dfb851d8c3590c354058aee556e32e408bdfbf8c357d57
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: NDK and OCCT source (pinned, checksums checked)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          mkdir -p ~/android && cd ~/android
          curl -sfLO "https://dl.google.com/android/repository/$NDK_ZIP"
          echo "$NDK_SHA1  $NDK_ZIP" | sha1sum -c
          unzip -q "$NDK_ZIP" && rm "$NDK_ZIP"
          curl -sfL -o occt.tar.gz "https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/$OCCT_TAG.tar.gz"
          echo "$OCCT_SHA256  occt.tar.gz" | sha256sum -c
          tar xzf occt.tar.gz && rm occt.tar.gz
          echo "ANDROID_NDK_HOME=$HOME/android/android-ndk-r28c" >> "$GITHUB_ENV"
          echo "OCCT_SRC=$HOME/android/OCCT-${OCCT_TAG#V}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: target/android/occt-arm64-v8a
          key: occt-android-arm64-${{ env.OCCT_TAG }}-r28c-${{ hashFiles('crates/kernel-occt/build.rs', 'xtask/src/android.rs') }}
      - name: OCCT for Android
        run: test -f target/android/occt-arm64-v8a/lib/libTKernel.a || cargo xtask android-occt arm64
      - name: shapecraft-cli for Android (16 KB pages checked)
        run: cargo xtask android-cli arm64
      - name: ShapeCraft APK (debug-signed)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.1" "platforms;android-35" > /dev/null
          cargo xtask android-apk arm64
      # The downloads go up first, so a failing emulator never costs the build.
      - uses: actions/upload-artifact@v4
        with:
          name: shapecraft-cli-android-arm64
          path: target/aarch64-linux-android/release/shapecraft-cli
      - uses: actions/upload-artifact@v4
        with:
          name: shapecraft-android-apk
          path: target/android/ShapeCraft-*.apk
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # x86_64 image; the arm64 build runs through Android's ARM translation. The action boots it with time limits
      # (a bare `adb wait-for-device` waited for an emulator that never came up until the job timed out).
      - name: Kernel smoke test and app start on the emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            cargo xtask android-smoke arm64
            cargo xtask android-run arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screen
          path: target/android/screen.png
          if-no-files-found: ignore
