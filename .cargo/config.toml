[alias]
# Build and maintenance jobs in Rust: cargo xtask (see xtask/src/main.rs).
xtask = "run -q -p xtask --"

# macOS: leave room in the programs' headers so `cargo xtask bundle-mac` can point them at the libraries inside the
# app (install_name_tool fails on binaries linked without it, seen on Intel).
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-headerpad_max_install_names"]
